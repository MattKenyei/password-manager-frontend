name: test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run test
      - run: npm run test:coverage

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pm_user
          POSTGRES_PASSWORD: pm_password
          POSTGRES_DB: password_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/password-manager-backend
          path: backend
      - uses: actions/checkout@v4
        with:
          path: frontend

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

            - name: Run backend
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: pm_user
          POSTGRES_PASSWORD: pm_password
          POSTGRES_DB: password_manager
          REDIS_ADDR: localhost:6379
          JWT_SECRET: e2e-test-secret-at-least-32-bytes-long
          SERVER_ADDR: :8080
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest

          # New goose syntax: goose DRIVER DBSTRING -dir DIR COMMAND
          goose postgres "postgres://pm_user:pm_password@localhost:5432/password_manager?sslmode=disable" \
            -dir ./migrations up

          # Build first, then run in background
          go build -o /tmp/server ./cmd/server
          /tmp/server &

          # Wait until the server responds — up to 15 seconds
          curl --retry 15 --retry-delay 1 --retry-connrefused --retry-all-errors \
            http://localhost:8080/health

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        working-directory: frontend
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
